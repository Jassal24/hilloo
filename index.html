<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            transition: all 0.5s ease;
            text-align: center;
            opacity: 0; 
            animation: fadeIn 2s forwards;
        }
        
        h1:hover {
            color: red;
            transform: scale(1.2);
        }

        
        @keyframes fadeIn {
            0% {
                opacity: 0; 
            }
            100% {
                opacity: 1; 
            }
        }
    </style>
</head>

        OwW!! LOL..

</body>
</html>
